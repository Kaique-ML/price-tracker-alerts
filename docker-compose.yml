version: "3.9"
services:
  scraper:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://user:pass@postgres:5432/price_tracker
    command: python3 scraper/main.py
    depends_on:
      - redis
      - postgres

  dashboard:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    command: streamlit run dashboard/app.py
    depends_on:
      - postgres

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass